<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mago Infinito - Beta</title>
<style>
:root{--bg:#0b0b14;--p1:#15132b;--p2:#0f0e1d;--line:#2b2850;--acc:#8f7cff;--gold:#ffd24a;--txt:#e8e6f0;--mut:#a9a5c4}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3a3566 transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Segoe UI,system-ui,sans-serif;overflow:hidden}
body{display:grid;grid-template-columns:260px minmax(0,1fr) 280px;grid-template-rows:minmax(0,1fr)}
#game{grid-column:2;grid-row:1;position:relative;min-width:0;min-height:0}
canvas{display:block;touch-action:none}
#tbar{display:none}
.panel{background:linear-gradient(180deg,var(--p1),var(--p2));padding:12px;overflow-y:auto;min-height:0}
#left{grid-column:1;grid-row:1;border-right:1px solid var(--line)}
#info{grid-column:1;grid-row:2;border-right:1px solid var(--line);border-top:1px solid var(--line)}
#shopc{grid-column:3;grid-row:1;border-left:1px solid var(--line)}
#inv{grid-column:3;grid-row:2;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.panel h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:2px 0 10px;display:flex;align-items:center;gap:8px}
.panel h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.panel h3{margin:0 0 2px;font-size:15px}
.sub{font-size:11px;color:var(--mut);line-height:1.4}
.panel p{font-size:12px;color:#c9c5e4;margin:6px 0;line-height:1.45}
.sec{font-size:10px;color:#7d79a0;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.1em}
.hint{font-size:11px;color:#7d79a0;margin-top:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:8px}
.hint b{color:#c9c5e4}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,5,12,.78);backdrop-filter:blur(3px);z-index:6}
.card{background:linear-gradient(180deg,#1b1838,#141228);border:1px solid #3a3566;border-radius:16px;padding:22px 26px;max-width:560px;width:92%;box-shadow:0 14px 50px #000b;max-height:92vh;overflow:auto}
.card h1{margin:0 0 4px;font-size:24px}
.card p{margin:0 0 14px;color:var(--mut)}
.btn{background:linear-gradient(180deg,#7a5cff,#5a3fe0);border:0;color:#fff;font:inherit;font-weight:700;padding:10px 22px;border-radius:10px;cursor:pointer;margin-top:10px;box-shadow:0 3px 0 #3a26a8}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3a26a8}
.btn.sm{padding:5px 10px;margin:0;font-size:12px;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#2b2850;box-shadow:0 3px 0 #1a1838}
input[type=text]{background:#0f0e1c;border:1px solid #3a3566;color:#fff;font:inherit;padding:8px 10px;border-radius:8px;width:200px}
table.rank{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
table.rank td,table.rank th{padding:3px 6px;border-bottom:1px solid var(--line)}
table.rank tr.me td{background:#2a2450;color:var(--gold)}
.heroes{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.hcard{background:#1a1832;border:2px solid #2f2b57;border-radius:12px;padding:6px;cursor:pointer;transition:transform .12s,border-color .12s}
.hcard:hover{transform:translateY(-3px)}
.hcard.on{border-color:var(--gold);box-shadow:0 0 16px #ffd24a44}
.hcard canvas{width:100%;height:auto;display:block}
.hcard b{font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;background:#1a1832;border:1px solid #2f2b57;border-radius:8px;color:inherit;font:inherit;font-size:12px;padding:6px;cursor:pointer}
.tab.on{border-color:var(--acc);background:#26224a}
.tab.alert::after{content:' ●';color:var(--gold)}
.pts{background:#1a1832;border:1px solid #2f2b57;border-radius:9px;padding:6px 10px;margin-bottom:8px;font-size:13px}
.pts.on{border-color:var(--gold);box-shadow:0 0 12px #ffd24a55;color:var(--gold)}
.srow{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:12px}
.srow:hover{background:#1c1a38}
.srow.sel{border-color:var(--acc);background:#1f1c40}
.srow.dim .nm{opacity:.55}
.srow .nm{flex:1}
.srow .nm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--mut);font-size:10px;line-height:1.3}
.plus.buy{min-width:70px;height:30px;font-size:12px;padding:0 8px}
.srow .lv{color:var(--mut);font-size:11px;min-width:34px;text-align:right}
.plus{min-width:24px;height:24px;border:0;border-radius:6px;background:#2c6b3c;color:#fff;font-weight:700;cursor:pointer;font-size:11px;padding:0 5px}
.plus.gold{background:#7a5a10}
.plus:disabled{background:#26243f;color:#6a6690;cursor:not-allowed}
.item{display:block;width:100%;text-align:left;background:#1a1832;border:1px solid #2f2b57;border-radius:9px;padding:7px 9px;margin-bottom:6px;color:inherit;font:inherit;cursor:pointer}
.item:hover:not(.off){border-color:var(--acc);background:#1f1c40}
.item.off{opacity:.45;cursor:not-allowed}
.item .nm{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.item .co{color:var(--gold);font-weight:700;white-space:nowrap}
.item .ds{font-size:11px;color:var(--mut);margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:1px 0}
.kv b{color:var(--gold);text-align:right}
.bar2{position:relative;height:14px;background:#000a;border:1px solid #ffffff30;border-radius:4px;overflow:hidden;margin:4px 0}
.bar2 i{position:absolute;left:0;top:0;bottom:0;width:0}
.bar2 b{position:absolute;inset:0;font-size:10px;text-align:center;line-height:14px}
.chk{font-size:11px;color:#c9c5e4;display:flex;gap:4px;align-items:center}
.dbtn{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:#1a1832;border:1px solid #2f2b57;border-radius:8px;padding:5px 7px;margin-bottom:4px;color:inherit;font:inherit;cursor:pointer;font-size:12px}
.dbtn:hover:not(:disabled){border-color:var(--acc)}
.dbtn:disabled{opacity:.45;cursor:not-allowed}
.dbtn .dn{flex:1}.dbtn small{display:block;color:var(--mut);font-size:10px}
.dbtn .dc{color:var(--gold);font-size:11px;white-space:nowrap}
/* dragón: ventana flotante */
#drMini{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3}
#drToggle{background:linear-gradient(180deg,#1f1c40,#171532);border:1px solid #3a3566;border-radius:20px;color:inherit;font:inherit;font-size:12px;padding:5px 14px;cursor:pointer}
#drToggle:hover{border-color:var(--acc)}
#drToggle.alert{border-color:var(--gold);box-shadow:0 0 12px #ffd24a66}
#drWin{display:none;position:absolute;top:50px;right:12px;width:330px;max-height:calc(100% - 140px);overflow:auto;z-index:4;background:linear-gradient(180deg,#1b1838,#141228);border:1px solid #3a3566;border-radius:14px;padding:12px;box-shadow:0 10px 40px #000b}
#drWin.open{display:block}
#drWin h2{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--acc);letter-spacing:.1em;text-transform:uppercase}
#drClose{background:transparent;border:0;color:var(--mut);font-size:16px;cursor:pointer}
/* barra de poderes */
#bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;max-width:96%;gap:6px 8px;align-items:flex-end;z-index:2}
.sp{display:flex;flex-direction:column;gap:3px;align-items:stretch;width:64px}
.cast{position:relative;overflow:hidden;height:48px;background:linear-gradient(180deg,#201d42,#16142e);border:1px solid #3a3566;border-radius:10px;color:inherit;font:inherit;cursor:pointer;font-size:22px;line-height:1}
.cast:hover:not(:disabled){border-color:var(--acc)}
.cast:disabled{opacity:.4;cursor:not-allowed;font-size:12px}
.cast .key{position:absolute;top:2px;left:5px;font-size:10px;font-weight:700;color:var(--acc)}
.cast .cdo{position:absolute;left:0;right:0;bottom:0;background:#000b;height:0}
.cast .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;text-shadow:0 0 4px #000}
.cast.ready{border-color:var(--gold);box-shadow:0 0 10px #ffd24a55}
.mode{font:inherit;font-size:10px;font-weight:700;border-radius:6px;border:1px solid #3a3566;background:#11101f;color:var(--mut);padding:2px 0;cursor:pointer}
.mode.auto{background:#2c6b3c;border-color:#4ac26a;color:#e6ffe9}
.ctl{height:48px;min-width:46px;background:linear-gradient(180deg,#201d42,#16142e);border:1px solid #3a3566;border-radius:10px;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0 8px}
.ctl:hover{border-color:var(--acc)}
@media(max-width:1100px){body{grid-template-columns:220px minmax(0,1fr) 250px}.sp{width:56px}.heroes{grid-template-columns:repeat(2,1fr)}}
@media (pointer:coarse){
  .plus{min-width:38px;height:36px;font-size:14px}
  .srow{padding:7px 6px;gap:8px}
  .item{padding:11px 10px}
  .btn{padding:12px 24px}
  .mode{padding:5px 0}
}
@media (max-width:900px){
  html,body{height:100%;overscroll-behavior:none}
  body{display:block}
  #game{position:fixed;left:0;right:0;top:0;bottom:calc(56px + env(safe-area-inset-bottom))}
  .panel{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom));max-height:64vh;z-index:8;display:none;border:0;border-top:2px solid var(--acc);border-radius:16px 16px 0 0;box-shadow:0 -12px 30px #000b}
  .panel.open{display:block}
  #left,#info,#shopc,#inv{border:0;border-top:2px solid var(--acc)}
  #tbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);z-index:9;background:#0f0e1d;border-top:1px solid var(--line)}
  #tbar button{flex:1;background:none;border:0;color:var(--txt);font:inherit;font-size:20px;line-height:1.1;padding:4px 0}
  #tbar button span{display:block;font-size:10px;color:var(--mut)}
  #tbar button.on{background:#26224a}
  #bar{bottom:6px;gap:4px 5px}
  .sp{width:44px}
  .cast{height:38px;font-size:17px}
  .cast .key{display:none}
  .ctl{height:38px;min-width:36px;padding:0 4px;font-size:13px}
  .mode{font-size:8px}
  .card{padding:16px 14px}
  .heroes{grid-template-columns:repeat(2,1fr)}
  .hint{display:none}
}
#infoInline,.dhead,.bdg{display:none}
@media (max-width:900px){
  #info{display:none !important}
  #infoInline{display:block;background:#1a1832;border:1px solid #2f2b57;border-radius:10px;padding:8px 10px;margin-bottom:10px}
  #infoInline h3{font-size:15px}
  .dhead{display:flex;position:sticky;top:-12px;z-index:3;justify-content:space-between;align-items:center;background:#15132b;padding:6px 0;margin:-4px 0 8px;font-size:12px;color:var(--mut)}
  .dclose{background:#2b2850;border:0;color:#fff;border-radius:8px;width:40px;height:34px;font-size:16px}
  #tbar button{position:relative;font-size:24px}
  #tbar button span{font-size:11px}
  .bdg{position:absolute;top:3px;right:calc(50% - 34px);min-width:20px;height:20px;border-radius:10px;background:#e0503a;color:#fff;font-size:12px;font-style:normal;font-weight:700;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 8px #e0503a}
  #bar{top:64px;right:8px;bottom:auto;left:auto;transform:none;flex-direction:column;flex-wrap:nowrap;align-items:flex-end;max-width:none;gap:8px}
  .ctl{width:46px;height:46px;min-width:46px;font-size:15px;padding:0;border-radius:12px;background:rgba(21,19,43,.85)}
  .srow{font-size:14px;padding:9px 6px}
  .item .nm{font-size:15px}.item .ds{font-size:12px}
  .panel p{font-size:13px}.kv{font-size:13px}
  .panel{max-height:68vh}
}
@media (pointer:coarse){.plus.buy{min-width:88px;height:42px;font-size:14px}}
</style>
</head>
<body>
<div class="panel" id="left">
  <div class="pts" id="ptsbox">★ Puntos: <b id="pts">0</b></div>
  <h2>Héroe</h2>
  <div id="heroName" class="sub" style="margin-bottom:4px"></div>
  <div id="heroSk"></div>
  <h2 style="margin-top:12px">Habilidades</h2>
  <div id="skills"></div>
  <div id="powers" style="display:none"></div>
  <div class="hint">Cada nivel da 1 punto. El botón de cada habilidad gasta un punto y, si no hay, oro.<br><b>P</b> pausa · <b>F</b> velocidad · <b>Rueda</b> o <b>+ / -</b> zoom</div>
</div>
<div id="game">
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div id="overlay"></div>
</div>
<div class="panel" id="shopc">
  <h2>Tienda</h2><div id="shop"></div>
  <h2 style="margin-top:14px">🐉 Dragón</h2>
  <div id="drStatus" class="sub"></div>
  <div class="bar2"><i id="drHp" style="background:#d63a4a"></i><b id="drHpT"></b></div>
  <div class="bar2"><i id="drXp" style="background:#4a8cff"></i><b id="drXpT"></b></div>
  <label class="chk" style="margin:4px 0"><input type="checkbox" id="drAuto"> Reponer huevo automáticamente</label>
  <div id="drPts" class="sub" style="margin-bottom:6px"></div>
  <div id="drSk"></div>
</div>
<div id="tbar">
  <button data-d="left">⚔️<span>Habilidades</span><i class="bdg" id="bdgSk"></i></button>
  <button data-d="shopc">🛒<span>Tienda y dragón</span><i class="bdg" id="bdgSh"></i></button>
</div>

 {id:'dagger',n:'Dagas',type:'phys',kind:'proj',cd:.8,dmg:7,spd:540,size:4,cnt:l=>1+(l>=3)+(l>=5)+(l>=10)+(l>=15),desc:'Dagas veloces. Nv3, 5, 10 y 15: +1 daga.'},
 {id:'arcane',n:'Misil arcano',type:'magic',kind:'proj',cd:1.1,dmg:10,spd:400,size:5,cnt:l=>1+(l>=3)+(l>=5)+(l>=10)+(l>=15),desc:'Misiles teledirigidos. Nv3, 5, 10 y 15: +1 misil.'},

/* res: multiplicador de daño por tipo (0 = inmune, <1 resiste, >1 débil) */

 {n:'Zombi',e:'🧟',armor:'Carne podrida',hp:40,sp:35,dmg:8,xp:6,gold:3,r:14,from:45,res:{poison:0,divine:1.6,fire:1.4,ice:.8,dark:.6}},
 {n:'Espectro',e:'👻',armor:'Etérea',hp:30,sp:62,dmg:7,xp:7,gold:4,r:13,from:75,res:{phys:.1,dark:.3,poison:0,divine:2,magic:1.3}},

 {n:'Demonio',e:'👹',armor:'Infernal',hp:110,sp:55,dmg:16,xp:16,gold:8,r:16,from:200,res:{divine:2,dark:.2,fire:.3,magic:.8,ice:1.2}},
 {n:'Autómata',e:'🤖',armor:'Metal',hp:90,sp:50,dmg:12,xp:12,gold:6,r:15,from:240,res:{phys:.6,elec:2,poison:0,fire:.8,ice:.9}},

  S.atk=(1+.05*it.ring)*(1+.015*clv('m_med'));

  S.regen=1.5+.6*it.amulet+.35*clv('m_med');

    x:cx()+Math.cos(a)*R,y:cy()+Math.sin(a)*R,

    xp:d.xp*(boss?8:1),gold:d.gold*(boss?8:1),boss:!!boss,
    pending:0,dots:{},slow:null,acc:0,accT:.7,accType:'fire',flash:0,dead:false};

  e.max=e.hp;G.enemies.push(e);

function kill(e){
  if(e.dead)return;e.dead=true;G.kills++;
  G.gold+=Math.ceil(e.gold*GOLDK*(1+G.t/120)*S.goldM);
  gainXp(e.xp*XPK*(1+G.t/100)*S.xpM);
  if(G.dragon)dragonXp(e.xp*XPK*(1+G.t/100)*.7);
  heroOnKill(e);
  if(!LOWQ&&G.fx.length<300)for(let i=0;i<5;i++)G.fx.push({k:'p',x:e.x,y:e.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,t:.5,c:'#ffffffaa'});
  if(e.boss)txt(e.x,e.y-30,'¡Jefe derrotado!','#ffd24a',20);
}
function need(){return Math.round(20*Math.pow(1.22,G.lvl-1))}
function gainXp(a){
  G.xp+=a;
  while(G.xp>=need()){
    G.xp-=need();G.lvl++;
    if(SK.every(q=>G.skills[q.id]>=SKMAX)){G.bonus++;txt(cx(),cy()-70,'Todo al máximo: +10% daño','#ffd24a',16)}else G.pending++;
    recalc();G.hp=Math.min(S.maxHp,G.hp+S.maxHp*.2);
    txt(cx(),cy()-50,'¡Nivel '+G.lvl+'!','#ffffff',22);
    for(const sp of SPS)if(sp.unlock===G.lvl)txt(cx(),cy()-80,'¡Nuevo poder: '+sp.n+'!','#ffd24a',18);

}

/* ============ DAÑO ============ */
function txt(x,y,s,c,size){if(LOWQ&&(size||13)<16)return;if(G.texts.length>(LOWQ?25:70))G.texts.shift();G.texts.push({x,y,s,c,size:size||13,t:.9})}
function dealDamage(e,amount,type){
  const m=mult(e,type),d=amount*m*(e.vt>G.t?e.vm:1);G.dmgBy[SRC]=(G.dmgBy[SRC]||0)+Math.min(d,Math.max(0,e.hp));e.hp-=d;e.flash=.08;
  if(m===0)txt(e.x,e.y-e.r,'Inmune','#888',11);
  else txt(e.x+(Math.random()-.5)*14,e.y-e.r,Math.round(d)+(m>=1.4?'!':m<=.7?'~':''),TYPES[type].c,m>=1.4?16:m<=.7?11:13);
  if(e.hp<=0)kill(e);
}
function addDot(e,type,dps,dur,stack){
  if(mult(e,type)===0)return;
  const d=e.dots[type];
  if(!d)e.dots[type]={dps,t:dur,src:SRC};
  else{d.t=dur;d.src=SRC;d.dps=stack?Math.min(d.dps+dps*.5,dps*5):Math.max(d.dps,dps)}
}
function hitEnemy(p,e){
  SRC=p.src||p.type;
  dealDamage(e,p.dmg,p.type);
  if(p.goldK&&e.dead){const gb=Math.ceil(e.gold*GOLDK*(1+.15*p.goldK)*(1+G.t/120)*S.goldM);G.gold+=gb;txt(e.x,e.y-e.r-14,'+'+gb+' 🪙','#ffd24a',15)}
  if(p.crit)txt(e.x,e.y-e.r-16,p.critT||'¡CRÍTICO x10!','#ff4040',18);
  if(p.stunC&&!e.dead&&Math.random()<p.stunC){e.stun=p.stunT||1;txt(e.x,e.y-e.r-12,'💫','#fff',14)}
  if(p.xl)txt(e.x,e.y-e.r-16,'¡XL!',TYPES[p.type].c,18);
  if(p.kill&&!e.dead&&mult(e,p.type)>0&&Math.random()<p.kill){
    if(e.boss)dealDamage(e,e.max*.1,p.type);
    else if(e.hp>p.dmg*30)dealDamage(e,e.max*.12,p.type);
    else{G.dmgBy[SRC]=(G.dmgBy[SRC]||0)+Math.max(0,e.hp);e.hp=0;txt(e.x,e.y-e.r-16,'☠ ¡MUERTE!','#82e04e',18);kill(e)}
  }
  if(p.burn)addDot(e,'fire',p.dmg*.35,3,false);
  if(p.pdps)addDot(e,'poison',p.pdps,5,true);
  if(p.bleed)addDot(e,'phys',p.bleed,4,true);
  if(p.slow&&mult(e,p.type)>0)e.slow={a:p.slow,t:2.5};
  if(p.splash){
    for(const o of G.enemies){if(o===e||o.dead)continue;
      if((o.x-p.x)**2+(o.y-p.y)**2<p.splash*p.splash){dealDamage(o,p.dmg*.5,p.type);if(p.slow&&!o.dead&&mult(o,p.type)>0)o.slow={a:p.slow,t:2.5}}}
    G.fx.push({k:'ring',x:p.x,y:p.y,r:p.splash,t:.3,c:TYPES[p.type].c});
  }
}
function release(p){if(p.tgt&&p.exp)p.tgt.pending-=p.exp;p.exp=0}

/* Elige objetivos cercanos evitando el overkill */
function pick(n,type,dmg,range,from){
  const fx=from?from.x:cx(),fy=from?from.y:cy(),r2=range*range;
  const c=[];
  for(const e of G.enemies){
    if(e.dead)continue;
    const dd=(e.x-fx)**2+(e.y-fy)**2;
    if(dd>r2)continue;
    const m=mult(e,type);if(m===0)continue;
    if(e.hp-e.pending-dotLeft(e)<=0.5)continue;
    c.push([dd,e]);
  }
  c.sort((a,b)=>a[0]-b[0]);
  return c.slice(0,n).map(a=>a[1]);
}

/* ============ HABILIDADES ============ */
function castSkill(s,lvl){
  const dmg=s.dmg*(BAL[s.id]||1)*DMG_K*skK(lvl)*S.dmg,col=TYPES[s.type].c;
  const n=s.cnt(lvl);
  if(s.kind==='chain'){
    const red=lvl>=ULT_LVL&&Math.random()<ultChance('elec',lvl);
    const t=pick(1,s.type,dmg,red?1e5:S.range)[0];if(!t)return false;
    const hops=(lvl<=5?lvl:5+Math.floor((lvl-5)/3))+(red?3+Math.floor(ultU(lvl)/5):0);
    const hit=new Set([t]);let cur=t,d=red?dmg*(1.6+.04*ultU(lvl)):dmg;const pts=[[cx(),cy()-10],[t.x,t.y]];
    if(red)txt(t.x,t.y-26,'¡RAYO ROJO!','#ff3030',18);
    dealDamage(t,d,s.type);
    for(let i=0;i<hops;i++){
      d*=red?.88:.85;let nb=null,bd=red?320*320:170*170;
      for(const e of G.enemies){if(e.dead||hit.has(e)||mult(e,s.type)===0)continue;
        if(e.hp-e.pending-dotLeft(e)<=0.5)continue;
        const dd=(e.x-cur.x)**2+(e.y-cur.y)**2;if(dd<bd){bd=dd;nb=e}}
      if(!nb)break;hit.add(nb);pts.push([nb.x,nb.y]);dealDamage(nb,d,s.type);cur=nb;
    }
    G.fx.push({k:'bolt',pts,t:.18,c:red?'#ff2a2a':col});
    return true;
  }
  if(s.kind==='pulse'){
    const R=110+3*lvl;
    if(!pick(1,s.type,dmg,R).length)return false;
    for(const e of G.enemies){if(e.dead||Math.hypot(e.x-cx(),e.y-cy())>R+e.r)continue;dealDamage(e,dmg,s.type)}
    G.fx.push({k:'ring',x:cx(),y:cy(),r:R,t:.3,c:col});
    return true;
  }
  const tg=pick(n,s.type,dmg,S.range);
  if(!tg.length)return false;
  for(const t of tg){
    const ex=dmg*mult(t,s.type);
    if(s.kind==='burst'){
      const R=55+lvl,bx=t.x,by=t.y;
      for(const o of G.enemies){
        if(o.dead||(o.x-bx)**2+(o.y-by)**2>(R+o.r)**2)continue;
        dealDamage(o,dmg,s.type);
        if(o.dead)continue;
        if(s.id==='thorn'){
          addDot(o,'poison',(3+2*lvl)*S.dmg,4,true);
          if(lvl>=ULT_LVL&&Math.random()<ultChance('thorn',lvl)){o.root=3+.1*ultU(lvl);txt(o.x,o.y-o.r-12,'🌿 ¡Enredado!','#82e04e',13)}
        }
        if(s.id==='hail'){
          if(mult(o,s.type)>0)o.slow={a:Math.min(.8,.3+.03*lvl),t:2.5};
          if(lvl>=ULT_LVL&&Math.random()<ultChance('hail',lvl)){o.stun=2+.05*ultU(lvl);txt(o.x,o.y-o.r-12,'❄ ¡Congelado!','#7fd6ff',13)}
        }
      }
      G.fx.push({k:'ring',x:bx,y:by,r:R,t:.3,c:col});
    }else if(s.kind==='smite'){
      dealDamage(t,dmg,s.type);
      for(const o of G.enemies){if(o===t||o.dead)continue;if((o.x-t.x)**2+(o.y-t.y)**2<45*45)dealDamage(o,dmg*.5,s.type)}
      G.fx.push({k:'beam',x:t.x,y:t.y,t:.3,c:col});
      G.fx.push({k:'ring',x:t.x,y:t.y,r:45,t:.3,c:col});
    }else if(s.kind==='orb'){
      const a=Math.atan2(t.y-cy(),t.x-cx());
      G.projs.push({kind:'orb',x:cx(),y:cy(),vx:Math.cos(a)*s.spd,vy:Math.sin(a)*s.spd,size:s.size,life:s.life,type:s.type,dmg,tgt:t,exp:ex,hit:new Set(),src:s.n});
      t.pending+=ex;
    }else{
      const p={kind:'home',x:cx()+(Math.random()-.5)*10,y:cy()-10,spd:s.spd,size:s.size,type:s.type,dmg,tgt:t,exp:ex,life:5,src:s.n};
      if(s.id==='fire'){p.burn=true;p.splash=45+4*lvl}
      if(s.id==='hammer')p.splash=55+2*lvl;
      if(s.id==='frost'){p.splash=45+4*lvl;p.slow=Math.min(.8,.25+.04*lvl)}
      if(s.id==='poison'){p.pdps=(3+2.5*lvl)*S.dmg;if(lvl>=ULT_LVL)p.kill=ultChance('poison',lvl)}
      if(s.id==='goldshot'){
        p.goldK=lvl;p.col='#ffd24a';
        if(lvl>=6){const m=goldMult(lvl);p.dmg*=m;p.exp=ex*m;p.gm=m}
      }
      if(lvl>=ULT_LVL&&(s.id==='dagger'||s.id==='fire'||s.id==='frost')&&Math.random()<ultChance(s.id,lvl)){
        const u=ultU(lvl);
        if(s.id==='dagger'){const k=10+.3*u;p.crit=true;p.dmg*=k;p.exp=ex*k;p.size*=1.8}
        else{const k=3+.1*u;p.xl=true;p.dmg*=k;p.exp=ex*k;p.splash*=2.2;p.size*=2.2}
      }
      G.projs.push(p);t.pending+=p.exp;
    }
  }
  return true;
}

/* ============ ULTIMATES CON ENFRIAMIENTO ============ */
function castUlt(s,l){
  const id=s.id,u=ultU(l),dmg=s.dmg*(BAL[id]||1)*DMG_K*skK(l)*S.dmg*(1+.05*u),col=TYPES[s.type].c;

    txt(cx(),cy()-70,'★ ¡Juicio de luz!',col,18);

  }

    txt(cx(),cy()-70,'★ ¡Orbe gigante!',col,18);
    return true;
  }
  if(id==='spear'){
    if(all.length<3)return false;
    let n=0;
    for(const e of all){
      const ex=e.x,ey=e.y;
      dealDamage(e,dmg,s.type);
      if(!e.dead){e.stun=2+.05*u;txt(e.x,e.y-e.r-12,'📌','#fff',14)}
      if(n++<80)G.fx.push({k:'beam',x:ex,y:ey,t:.25,c:col});
    }
    txt(cx(),cy()-70,'★ ¡Clavados al suelo!',col,18);
    return true;
  }
  if(id==='pulse'){
    const R=230+4*u;
    if(countNear(cx(),cy(),R)<3)return false;
    for(const e of G.enemies){
      if(e.dead||Math.hypot(e.x-cx(),e.y-cy())>R+e.r)continue;
      dealDamage(e,dmg*3,'divine');
      if(!e.dead)e.rep=3+.05*u;
    }
    G.fx.push({k:'ring',x:cx(),y:cy(),r:R,t:.3,c:TYPES.divine.c});
    G.fx.push({k:'ring',x:cx(),y:cy(),r:R*.6,t:.3,c:'#ffffff'});
    txt(cx(),cy()-70,'★ ¡Pulso supremo!',TYPES.divine.c,18);
    return true;
  }
  if(id==='hammer'){
    const hd=dmg*2.5;
    if(!pick(1,s.type,hd,S.range)[0])return false;
    for(let i=0;i<10;i++){
      G.delayed.push({t:.01+.1*i,fn:()=>{
        const tg=pick(1,s.type,hd,S.range+100)[0];
        if(!tg)return;
        const ex=hd*mult(tg,s.type);
        G.projs.push({kind:'home',x:cx(),y:cy()-10,spd:400,size:9,type:s.type,dmg:hd,splash:55+2*l,tgt:tg,exp:ex,life:6,src:'★ '+s.n});

}
function updateUlts(dt){

/* ============ BOLAS ORBITALES Y PULPO VAMPÍRICO ============ */
const goldMult=l=>1+Math.min(1.5+.15*(l-6),G.gold/1000*(.5+.05*(l-6)));
const orbitInfo=l=>({n:Math.min(5,l),r:7+.6*l,rad:46+l,sp:2+.12*l});
function updateOrbit(dt){
  const l=G.skills.orbit;if(!l)return;
  const o=orbitInfo(l),sk=SK.find(x=>x.id==='orbit');
  G.orbA+=o.sp*dt;
  const dmg=sk.dmg*BAL.orbit*DMG_K*skK(l)*(1+.06*Math.max(0,l-5))*S.dmg;
  SRC='Bolas de fuego orbitales';
  for(let i=0;i<o.n;i++){
    const a=G.orbA+i*6.283/o.n,bx=cx()+Math.cos(a)*o.rad,by=cy()+Math.sin(a)*o.rad;
    for(const e of G.enemies){
      if(e.dead)continue;
      const rr=o.r+e.r;
      if((e.x-bx)**2+(e.y-by)**2>rr*rr)continue;
      if(!e.ob)e.ob=[];
      if((e.ob[i]||0)>G.t)continue;
      e.ob[i]=G.t+.4;
      dealDamage(e,dmg,'fire');
      if(!e.dead)addDot(e,'fire',dmg*.3,2,false);
    }
  }
}
function updateTentacles(dt){
  const l=G.skills.tentacle;
  if(!l){G.tent=[];return}
  const n=Math.min(8,1+Math.floor((l-1)/2)),sk=SK.find(x=>x.id==='tentacle');
  while(G.tent.length<n)G.tent.push({tgt:null,tk:Math.random()*.5});
  G.tent.length=n;
  const dmg=sk.dmg*BAL.tentacle*DMG_K*skK(l)*S.dmg,range=S.range,used=new Set();
  for(const t of G.tent)if(t.tgt&&!t.tgt.dead)used.add(t.tgt);
  SRC='Pulpo vampírico';
  for(const t of G.tent){
    if(t.tgt&&(t.tgt.dead||Math.hypot(t.tgt.x-cx(),t.tgt.y-cy())>range+30))t.tgt=null;
    if(!t.tgt){
      let nb=null,bd=range*range;
      for(const e of G.enemies){
        if(e.dead||used.has(e)||mult(e,'dark')===0)continue;
        const dd=(e.x-cx())**2+(e.y-cy())**2;
        if(dd<bd){bd=dd;nb=e}
      }
      if(nb){t.tgt=nb;used.add(nb)}
    }
    if(!t.tgt)continue;
    t.tk-=dt;
    if(t.tk<=0){
      t.tk=.5;
      const e=t.tgt,eff=Math.min(dmg*mult(e,'dark'),Math.max(0,e.hp));
      dealDamage(e,dmg,'dark');
      if(eff>0){const h=S.maxHp*(.0025+.0002*l);G.hp=Math.min(S.maxHp,G.hp+h);G.healAcc=(G.healAcc||0)+h}
    }
  }
  G.healT=(G.healT||0)-dt;
  if(G.healT<=0){G.healT=1;if((G.healAcc||0)>=1)txt(cx()+(Math.random()-.5)*30,cy()-36,'+'+Math.round(G.healAcc),'#b27cff',13);G.healAcc=0}
}

const DRMAX=10,EGG_COST=150,EGG_TIME=40,DRB=.7;
const DRSK=[
 {id:'crit',n:'Golpe crítico',icon:'💥',base:60,d:l=>l?'Prob. '+Math.round(100*(.08+.04*l))+'% · daño x'+(2.5+.15*l).toFixed(2):'Sin desbloquear'},
 {id:'stun',n:'Golpe con stun',icon:'💫',base:70,d:l=>l?'Prob. '+Math.round(100*(.10+.035*l))+'% · aturde '+(1+.12*l).toFixed(1)+' s':'Sin desbloquear'},
 {id:'life',n:'Robo de vida',icon:'🩸',base:70,d:l=>l?'Cura el '+Math.round(100*(.06+.025*l))+'% del daño que hace':'Sin desbloquear'},
 {id:'aspd',n:'Velocidad de ataque',icon:'⚡',base:50,d:l=>'+'+(10*l)+'% velocidad de ataque'},
 {id:'dmg',n:'Daño',icon:'🗡️',base:50,d:l=>'+'+(12*l)+'% de daño'},
 {id:'tornado',n:'Vuelo tornado',icon:'🌪️',base:90,d:l=>l?'Cambia de posición empujando y dañando · enfr. '+Math.max(6,15-.8*l).toFixed(0)+' s':'Sin desbloquear'},
 {id:'tail',n:'Coletazo',icon:'💢',base:80,d:l=>l?'Golpe en área (radio '+(70+4*l)+') · enfr. '+Math.max(2.5,7-.35*l).toFixed(1)+' s':'Sin desbloquear'},
 {id:'flame',n:'Llamarada',icon:'🔥',base:90,d:l=>l?'Cono de fuego (largo '+(170+12*l)+') · enfr. '+Math.max(4,11-.6*l).toFixed(0)+' s':'Sin desbloquear'}
];
const drCost=id=>Math.round(DRSK.find(x=>x.id===id).base*Math.pow(1.45,G.dr.sk[id]));
const drNeed=()=>Math.round(14*Math.pow(1.2,G.dr.lvl-1));
function dragonStats(){
  const L=G.dr.lvl,k=G.dr.sk;
  return{
    max:(110+55*L)*(1+G.t/300),
    r:12+1.4*Math.min(L,16),
    base:(10+5*L)*DMG_K*S.dmg*(1+.12*k.dmg)*DRB,
    aspd:1+.10*k.aspd,
    spd:150+6*Math.min(L,20),
    aggro:130+4*L,
    crit:k.crit?.08+.04*k.crit:0,critM:2.5+.15*k.crit,
    stun:k.stun?.10+.035*k.stun:0,stunT:1+.12*k.stun,
    ls:k.life?.06+.025*k.life:0
  };
}
function dragonXp(a){
  const dr=G.dr;dr.xp+=a;
  while(dr.xp>=drNeed()){dr.xp-=drNeed();dr.lvl++;dr.pts++;if(G.dragon)txt(G.dragon.x,G.dragon.y-34,'🐉 ¡Nivel '+dr.lvl+'!','#7be07b',16)}
}
function dragonUp(id,mode){
  const dr=G.dr,d=DRSK.find(x=>x.id===id);
  if(!d||G.modal||G.over||dr.sk[id]>=DRMAX)return false;
  if(mode==='pt'){if(dr.pts<=0)return false;dr.pts--}
  else{const c=drCost(id);if(G.gold<c)return false;G.gold-=c}
  dr.sk[id]++;return true;
}
function buyEgg(){
  const dr=G.dr;
  if(G.over||G.dragon||dr.egg||G.gold<dr.eggCost)return false;
  const t=Math.min(120,EGG_TIME+10*dr.deaths);
  G.gold-=dr.eggCost;dr.egg={t,tot:t};
  return true;
}
function hatch(){
  const st=dragonStats();
  G.dr.egg=null;
  G.dragon={x:cx()+64,y:cy()+30,hp:st.max,max:st.max,r:st.r,aggro:st.aggro,atk:.5,flap:0,dash:null,inv:false,face:1,a:0,cds:{tornado:2,tail:1,flame:3}};
  txt(cx()+64,cy()-10,'🐉 ¡El dragón ha nacido!','#7be07b',18);
  G.fx.push({k:'ring',x:cx()+64,y:cy()+30,r:60,t:.3,c:'#7be07b'});
}
function updateDragon(dt){
  const dr=G.dr;
  for(const f of G.drfx)f.t-=dt;
  G.drfx=G.drfx.filter(f=>f.t>0);
  if(dr.egg){dr.egg.t-=dt;if(dr.egg.t<=0)hatch()}
  else if(!G.dragon&&dr.auto)buyEgg();
  const dg=G.dragon;if(!dg)return;
  if(dg.hp<=0){
    convertSkelDragon(dg);
    G.dragon=null;dr.deaths++;dr.eggCost=Math.round(dr.eggCost*1.6);
    txt(dg.x,dg.y-20,'💀 ¡El dragón ha caído!','#ff5a5a',20);
    G.fx.push({k:'ring',x:dg.x,y:dg.y,r:70,t:.3,c:'#ff5a5a'});
    return;
  }
  const st=dragonStats(),sk=dr.sk;
  dg.hp=Math.min(st.max,dg.hp*st.max/dg.max);dg.max=st.max;dg.r=st.r;dg.aggro=st.aggro;
  dg.hp=Math.min(dg.max,dg.hp+dg.max*.004*dt);
  dg.flap+=dt*(dg.dash?20:9);
  dg.atk-=dt;for(const c in dg.cds)dg.cds[c]-=dt;
  SRC='🐉 Dragón';
  const x0=cx(),y0=cy(),leash=S.range+60;
  if(dg.dash){
    const d=dg.dash;d.t+=dt;
    const pr=Math.min(1,d.t/d.dur);
    dg.x=d.x0+(d.x1-d.x0)*pr;dg.y=d.y0+(d.y1-d.y0)*pr;
    const dmg=st.base*1.8*(1+.15*sk.tornado);
    for(const e of G.enemies){
      if(e.dead||d.hit.has(e))continue;
      if((e.x-dg.x)**2+(e.y-dg.y)**2>(dg.r+e.r+16)**2)continue;
      d.hit.add(e);dealDamage(e,dmg,'phys');
      if(!e.dead){const dx=e.x-dg.x,dy=e.y-dg.y,dd=Math.hypot(dx,dy)||1,pw=70+5*sk.tornado;e.x+=dx/dd*pw;e.y+=dy/dd*pw}
    }
    G.fx.push({k:'p',x:dg.x,y:dg.y,vx:(Math.random()-.5)*120,vy:(Math.random()-.5)*120,t:.4,c:'#b9d6ffaa'});
    if(pr>=1){dg.dash=null;dg.inv=false;dg.cds.tornado=Math.max(6,15-.8*sk.tornado);G.fx.push({k:'ring',x:dg.x,y:dg.y,r:90,t:.3,c:'#b9d6ff'})}
    return;
  }
  let tgt=null,bd=1e12;
  for(const e of G.enemies){
    if(e.dead||Math.hypot(e.x-x0,e.y-y0)>leash)continue;
    const dd=(e.x-dg.x)**2+(e.y-dg.y)**2;if(dd<bd){bd=dd;tgt=e}
  }
  if(sk.tornado&&dg.cds.tornado<=0&&countNear(x0,y0,leash)>=3){
    const sp=bestSpot(110,leash);
    dg.dash={x0:dg.x,y0:dg.y,x1:sp.x,y1:sp.y,t:0,dur:.4,hit:new Set()};dg.inv=true;
    G.fx.push({k:'ring',x:dg.x,y:dg.y,r:60,t:.3,c:'#b9d6ff'});txt(dg.x,dg.y-30,'🌪️','#fff',20);
    return;
  }
  if(sk.tail&&dg.cds.tail<=0){
    const R=70+4*sk.tail+dg.r;
    if(countNear(dg.x,dg.y,R)>=2){
      const dmg=st.base*1.2*(1+.12*sk.tail);
      for(const e of G.enemies){
        if(e.dead)continue;
        const dx=e.x-dg.x,dy=e.y-dg.y,dd=Math.hypot(dx,dy);
        if(dd>R+e.r)continue;
        dealDamage(e,dmg,'phys');
        if(!e.dead&&dd>1){e.x+=dx/dd*35;e.y+=dy/dd*35}
      }
      G.fx.push({k:'ring',x:dg.x,y:dg.y,r:R,t:.3,c:'#ffd24a'});
      dg.cds.tail=Math.max(2.5,7-.35*sk.tail);
    }
  }
  if(sk.flame&&dg.cds.flame<=0&&tgt&&Math.sqrt(bd)<=170+12*sk.flame){
    const a=Math.atan2(tgt.y-dg.y,tgt.x-dg.x),len=170+12*sk.flame,half=.5,dmg=st.base*1.5*(1+.1*sk.flame);
    for(const e of G.enemies){
      if(e.dead)continue;
      const dx=e.x-dg.x,dy=e.y-dg.y,dd=Math.hypot(dx,dy);
      if(dd>len+e.r)continue;
      let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)>half)continue;
      dealDamage(e,dmg,'fire');if(!e.dead)addDot(e,'fire',dmg*.2,3,false);
    }
    G.drfx.push({x:dg.x,y:dg.y,a,len,half,t:.45,tot:.45});
    dg.cds.flame=Math.max(4,11-.6*sk.flame);
  }
  if(tgt){
    const dx=tgt.x-dg.x,dy=tgt.y-dg.y,d=Math.hypot(dx,dy),reach=dg.r+tgt.r+4;
    if(d>reach){dg.x+=dx/d*st.spd*dt;dg.y+=dy/d*st.spd*dt;dg.face=dx>=0?1:-1}
    else if(dg.atk<=0){
      let d0=st.base,crit=false;
      if(st.crit&&Math.random()<st.crit){d0*=st.critM;crit=true}
      const eff=Math.min(d0*mult(tgt,'phys'),Math.max(0,tgt.hp));
      dealDamage(tgt,d0,'phys');
      if(crit)txt(tgt.x,tgt.y-tgt.r-16,'¡CRÍTICO!','#ff4040',16);
      if(st.ls&&eff>0)dg.hp=Math.min(dg.max,dg.hp+eff*st.ls);
      if(!tgt.dead&&st.stun&&Math.random()<st.stun){tgt.stun=st.stunT;txt(tgt.x,tgt.y-tgt.r-12,'💫','#fff',14)}
      dg.atk=.85/st.aspd;
      G.fx.push({k:'p',x:tgt.x,y:tgt.y,vx:(Math.random()-.5)*140,vy:(Math.random()-.5)*140,t:.3,c:'#ffd24aaa'});
    }
  }else{
    dg.a+=dt*.8;
    const tx=x0+Math.cos(dg.a)*75,ty=y0+Math.sin(dg.a)*40-10;
    const dx=tx-dg.x,dy=ty-dg.y,d=Math.hypot(dx,dy);
    if(d>4){const m=Math.min(d,st.spd*.8*dt);dg.x+=dx/d*m;dg.y+=dy/d*m;dg.face=dx>=0?1:-1}
  }
}
function drawDragon(x0,y0){
  const dr=G.dr;
  if(dr.egg){
    const ex=x0+64,ey=y0+30,fr=1-dr.egg.t/dr.egg.tot;
    ctx.save();ctx.translate(ex,ey);ctx.rotate(Math.sin(G.t*(4+fr*8))*(.1+fr*.25));
    ctx.font='28px "Segoe UI Emoji",serif';ctx.fillText('🥚',0,0);ctx.restore();
    ctx.beginPath();ctx.arc(ex,ey,20,-1.57,-1.57+6.283*fr);ctx.strokeStyle='#7be07b';ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle='#2a1f10';ctx.font='bold 11px Segoe UI,sans-serif';ctx.fillText(Math.ceil(dr.egg.t)+'s',ex,ey+30);
  }
  for(const f of G.drfx){
    const k=f.t/f.tot;
    ctx.globalAlpha=Math.max(0,k);ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.arc(f.x,f.y,f.len*(1.1-k*.2),f.a-f.half,f.a+f.half);ctx.closePath();
    const g=ctx.createRadialGradient(f.x,f.y,10,f.x,f.y,f.len);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4a1a');
    ctx.fillStyle=g;ctx.fill();ctx.globalAlpha=1;
  }
  if(G.dragon)drawDragonUnit(G.dragon,false);
  for(const sd of G.sdrags)drawDragonUnit(sd,true);
}
function drawDragonUnit(dg,skel){
  const dr=G.dr;
  const cols=['#58c46a','#4aa3df','#a050d0','#e0503a','#e8b923'],col=skel?'#cfd3da':cols[Math.min(4,Math.floor(dr.lvl/6))];
  const sc=.75+.045*Math.min(dr.lvl,30),flap=Math.sin(dg.flap),bob=Math.sin(G.t*3+(skel?1.7:0))*2;
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(dg.x,dg.y+dg.r+8,dg.r*.9,dg.r*.3,0,0,6.3);ctx.fill();
  ctx.save();ctx.translate(dg.x,dg.y+bob);ctx.scale(sc,sc);
  ctx.fillStyle=col;ctx.globalAlpha=skel?.7:.85;
  for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(sd*6,-2);ctx.lineTo(sd*(30+flap*4),-20-flap*10);ctx.lineTo(sd*(36+flap*3),4-flap*5);ctx.lineTo(sd*10,10);ctx.closePath();ctx.fill()}
  ctx.globalAlpha=1;
  ctx.beginPath();ctx.moveTo(-4,12);ctx.quadraticCurveTo(-18*dg.face,22,-24*dg.face,14+Math.sin(G.t*5)*4);ctx.lineWidth=5;ctx.strokeStyle=col;ctx.stroke();ctx.lineWidth=1;
  ctx.beginPath();ctx.ellipse(0,4,13,12,0,0,6.3);ctx.fillStyle=col;ctx.fill();
  if(skel){ctx.strokeStyle='#5a6070';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(-8,4+i*4);ctx.lineTo(8,4+i*4);ctx.stroke()}}
  else{ctx.beginPath();ctx.ellipse(0,7,8,7,0,0,6.3);ctx.fillStyle='#ffe9a8';ctx.fill()}
  ctx.font='26px "Segoe UI Emoji",serif';ctx.fillText(skel?'💀':'🐲',0,-9);
  if(skel){ctx.fillStyle='#7be07b';ctx.beginPath();ctx.arc(-4,-11,1.8,0,6.3);ctx.arc(4,-11,1.8,0,6.3);ctx.fill()}
  ctx.restore();
  const w=40,by=dg.y-dg.r*sc-26;
  ctx.fillStyle='#000a';ctx.fillRect(dg.x-w/2,by,w,5);ctx.fillStyle=skel?'#cfd3da':(dg.hp/dg.max>.35?'#4ac26a':'#e04050');ctx.fillRect(dg.x-w/2,by,w*Math.max(0,dg.hp/dg.max),5);
  ctx.fillStyle='#2a1f10';ctx.font='bold 11px Segoe UI,sans-serif';ctx.fillText(skel?'Esqueleto':'Nv '+dr.lvl,dg.x,by-6);
}
const maxSkelDragons=()=>{const l=clv('n_skeldragon');return l?1+Math.floor((l-1)/4):0};
function convertSkelDragon(dg){
  if(G.hero!=='necro'||G.sdrags.length>=maxSkelDragons())return;
  const st=dragonStats(),l=clv('n_skeldragon'),k=.7+.035*l;
  G.sdrags.push({x:dg.x,y:dg.y,hp:st.max*k,max:st.max*k,r:st.r,aggro:st.aggro,atk:.5,flap:0,face:1,a:Math.random()*6.283,inv:false,dmgb:st.base*k,spd:st.spd,flame:G.dr.sk.flame,fcd:4});
  txt(dg.x,dg.y-40,'💀 ¡Dragón esqueleto!','#cfd3da',20);
  G.fx.push({k:'ring',x:dg.x,y:dg.y,r:80,t:.4,c:'#cfd3da'});
}
function updateSkelDragons(dt){
  if(!G.sdrags.length)return;
  SRC='Dragón esqueleto';
  const x0=cx(),y0=cy(),leash=S.range+60;
  for(const dg of G.sdrags){
    if(dg.hp<=0)continue;
    dg.flap+=dt*9;dg.atk-=dt;dg.fcd-=dt;
    let tgt=null,bd=1e12;
    for(const e of G.enemies){
      if(e.dead||Math.hypot(e.x-x0,e.y-y0)>leash)continue;
      const dd=(e.x-dg.x)**2+(e.y-dg.y)**2;if(dd<bd){bd=dd;tgt=e}
    }
    if(dg.flame&&dg.fcd<=0&&tgt&&Math.sqrt(bd)<=170+12*dg.flame){
      const a=Math.atan2(tgt.y-dg.y,tgt.x-dg.x),len=170+12*dg.flame,half=.5,dmg=dg.dmgb*1.5;
      for(const e of G.enemies){
        if(e.dead)continue;
        const dx=e.x-dg.x,dy=e.y-dg.y,dd=Math.hypot(dx,dy);
        if(dd>len+e.r)continue;
        let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));
        if(Math.abs(da)>half)continue;
        dealDamage(e,dmg,'fire');
      }
      G.drfx.push({x:dg.x,y:dg.y,a,len,half,t:.45,tot:.45});
      dg.fcd=Math.max(4,11-.6*dg.flame);
    }
    if(tgt){
      const dx=tgt.x-dg.x,dy=tgt.y-dg.y,d=Math.hypot(dx,dy),reach=dg.r+tgt.r+4;
      if(d>reach){dg.x+=dx/d*dg.spd*dt;dg.y+=dy/d*dg.spd*dt;dg.face=dx>=0?1:-1}
      else if(dg.atk<=0){dealDamage(tgt,dg.dmgb,'phys');dg.atk=.85}
    }else{
      dg.a+=dt*.7;
      const tx=x0+Math.cos(dg.a)*105,ty=y0+Math.sin(dg.a)*55-10,dx=tx-dg.x,dy=ty-dg.y,d=Math.hypot(dx,dy);
      if(d>4){const m=Math.min(d,dg.spd*.8*dt);dg.x+=dx/d*m;dg.y+=dy/d*m;dg.face=dx>=0?1:-1}
    }
  }
  G.sdrags=G.sdrags.filter(d=>d.hp>0);
}

/* ============ PODERES ESPECIALES, HABILIDADES DE MASCOTA Y ALIADOS ============ */
function hurt(d){
  if(S.dodge&&Math.random()<S.dodge){if(G.t-(G.dodgeT||-9)>.8){G.dodgeT=G.t;txt(cx()+(Math.random()-.5)*30,cy()-34,'¡Esquiva!','#7be07b',13)}return}
  if(G.shield>0){const a=Math.min(G.shield,d);G.shield-=a;d-=a}
  G.hp-=d;
}
const countNear=(x,y,r)=>{let n=0;const r2=r*r;for(const e of G.enemies)if(!e.dead&&(e.x-x)**2+(e.y-y)**2<=r2)n++;return n};
function autoOk(id){
  switch(id){
    case'nova':return countNear(cx(),cy(),130+3*G.lvl)>=3||G.enemies.some(e=>e.boss&&Math.hypot(e.x-cx(),e.y-cy())<170);
    case'storm':return countNear(cx(),cy(),S.range)>=2;
    case'skel':return countNear(cx(),cy(),S.range)>=3;
    case'freeze':return countNear(cx(),cy(),S.range)>=6;
    case'meteor':return countNear(cx(),cy(),S.range)>=3;
    case'cloud':return countNear(cx(),cy(),S.range)>=4;
    case'judge':{const n=countNear(cx(),cy(),S.range);return n>=5||(G.hp<S.maxHp*.5&&n>=2)}
    case'hole':return countNear(cx(),cy(),S.range)>=5;
    case'warp':return countNear(cx(),cy(),S.range)>=8||G.enemies.some(e=>e.boss&&Math.hypot(e.x-cx(),e.y-cy())<S.range);
  }
  return false;
}
function castSpecial(id){
  const L=G.lvl,x0=cx(),y0=cy(),lv=G.spLv[id],sd=S.dmg*spK(lv)*(SPBAL[id]||1);
  if(id==='nova'){
    const R=(150+4*L)*(1+.03*(lv-1)),dmg=(60+10*L)*sd;
    for(const e of G.enemies){
      if(e.dead)continue;
      const dx=e.x-x0,dy=e.y-y0,d=Math.hypot(dx,dy);
      if(d>R+e.r)continue;
      dealDamage(e,dmg,'fire');
      if(e.dead)continue;
      addDot(e,'fire',dmg*.15,3,false);
      if(d>1){e.x+=dx/d*70;e.y+=dy/d*70}
    }
    G.fx.push({k:'ring',x:x0,y:y0,r:R,t:.3,c:TYPES.fire.c});
    G.fx.push({k:'ring',x:x0,y:y0,r:R*.7,t:.3,c:'#ffd24a'});
  }else if(id==='storm'){
    const c=G.enemies.filter(e=>!e.dead&&mult(e,'elec')>0&&Math.hypot(e.x-x0,e.y-y0)<=S.range+60);
    for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}
    const n=5+Math.floor(L/4)+Math.floor((lv-1)/2),dmg=(55+9*L)*sd;
    for(const e of c.slice(0,n)){
      const ex=e.x,ey=e.y;
      dealDamage(e,dmg,'elec');
      for(const o of G.enemies){if(o===e||o.dead)continue;if((o.x-ex)**2+(o.y-ey)**2<45*45)dealDamage(o,dmg*.4,'elec')}
      G.fx.push({k:'bolt',pts:[[ex+(Math.random()-.5)*40,0],[ex,ey]],t:.3,c:TYPES.elec.c});
      G.fx.push({k:'ring',x:ex,y:ey,r:45,t:.3,c:TYPES.elec.c});
    }
  }else if(id==='skel'){
    const n=3+Math.floor(L/6)+Math.floor((lv-1)/3);
    for(let i=0;i<n;i++){
      const a=Math.random()*6.283,hp=60*(1+.15*L)*spK(lv);
      G.allies.push({x:x0+Math.cos(a)*40,y:y0+Math.sin(a)*40,hp,max:hp,life:20+.5*(lv-1),dmgK:spK(lv)*SPBAL.skel,cd:0,r:11,ang:a});
    }
    G.fx.push({k:'ring',x:x0,y:y0,r:50,t:.3,c:'#cfd3da'});
  }else if(id==='freeze'){
    const dmg=(25+5*L)*sd;
    for(const e of G.enemies){
      if(e.dead||Math.hypot(e.x-x0,e.y-y0)>S.range)continue;
      dealDamage(e,dmg,'ice');
      if(!e.dead&&mult(e,'ice')>0)e.slow={a:Math.min(.9,.7+.01*lv),t:4};
    }
    G.fx.push({k:'ring',x:x0,y:y0,r:S.range,t:.3,c:TYPES.ice.c});
  }else if(id==='meteor'){
    const c=shuf(G.enemies.filter(e=>!e.dead&&Math.hypot(e.x-x0,e.y-y0)<=S.range+60));
    const n=4+Math.floor(L/4)+Math.floor((lv-1)/2),dmg=(70+11*L)*sd,R=65+1.5*(lv-1);
    for(const e of c.slice(0,n)){
      const ex=e.x,ey=e.y;

function bestSpot(rad,maxD){

function updateZones(dt){

function updateAllies(dt){
  const L=G.lvl;
  for(const a of G.allies){
    a.life-=dt;a.cd-=dt;

    SRC=a.src||(a.kind==='golem'?'Golems de piedra':a.kind==='mummy'?'Momias':a.kind==='vamp'?'Vampiros':'Soldados esqueleto');
    let t=null,bd=1e12;
    for(const e of G.enemies){
      if(e.dead)continue;

      const dd=(e.x-a.x)**2+(e.y-a.y)**2;if(dd<bd){bd=dd;t=e}
    }
    let tx,ty,near=false;
    if(t){tx=t.x;ty=t.y;near=Math.sqrt(bd)<=a.r+t.r+4}
    else{a.ang+=dt*(a.fly?1.6:0);const rr=a.fly?85:70;tx=cx()+Math.cos(a.ang)*rr;ty=cy()+Math.sin(a.ang)*rr}
    if(near){

        a.cd=k.rate;
        const base=(a.dmgAbs!=null?a.dmgAbs:(18+4*L)*S.dmg*(a.dmgK||1))*(a.scaleT?tsc()/a.tsAt:1);

}
function taunter(e){
  let best=null,bd=1e12;

  for(const u of list){
    if(u.hp<=0)continue;
    const dd=Math.hypot(u.x-e.x,u.y-e.y);

function wallHit(e,dist,dt){

  if(dist>w.R+e.r+4||dist<w.R-18)return false;
  const n=w.segs.length,idx=Math.floor(((Math.atan2(e.y-cy(),e.x-cx())+6.283)%6.283)/6.283*n);

}

const rageMul=()=>clv('b_rage')?1+(1-Math.max(0,G.hp)/S.maxHp)*(.4+.04*clv('b_rage')):1;
function shotAxe(t,dmg,b){
  let d=dmg*rageMul(),crit=false;
  const cl=clv('b_crit');
  if(cl&&Math.random()<Math.min(.6,.10+.025*cl)){d*=2+.12*cl;crit=true}
  const a=Math.atan2(t.y-cy(),t.x-cx()),dist=Math.hypot(t.x-cx(),t.y-cy());

  if(clv('b_bleed'))p.bleed=d*(.18+.012*clv('b_bleed'));

function updateBoom(p,dt){
  p.life-=dt;p.rot=(p.rot||0)+dt*16;

    p.x+=p.vx*dt;p.y+=p.vy*dt;p.trav+=p.spd*dt;

  }else{
    const dx=cx()-p.x,dy=cy()-8-p.y,d=Math.hypot(dx,dy),st=p.spd*1.15*dt;

  if(h==='dwarf'){rate/=1+.04*clv('d_aspd');burst=Math.min(5,1+Math.floor(clv('d_multi')/4))}
  if(h==='barbarian'){rate/=(1+.04*clv('b_aspd'))*rageMul();n=Math.min(4,1+Math.floor(clv('b_multi')/4))}
  let tg=pick(n,b.type,dmg,1e5);

  let close=null,cd0=1e12;

    shot(tg[0],dmg,b,h);
    for(let i=1;i<burst;i++)G.delayed.push({t:.08*i,fn:()=>{const t=pick(1,b.type,dmg,1e5)[0];if(t){SRC=b.n;shot(t,dmg,b,h)}}});

/* ============ ENEMIGOS QUE DISPARAN ============ */
function rangedAct(e,dist,dt,sp){
  const r=e.rng;if(!r)return false;
  const tn=taunter(e);
  const tx=tn?tn.x:cx(),ty=tn?tn.y:cy();
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
  if(d<=r.range){
    e.shotCd-=dt;
    if(e.shotCd<=0){e.shotCd=r.cd*(1+Math.random()*.2);fireEnemyShot(e,tx,ty)}
    return true;
  }
  if(e.root>0)return true;
  if(!tn&&wallHit(e,dist,dt))return true;
  e.x+=dx/d*sp*dt;e.y+=dy/d*sp*dt;
  return true;
}
function fireEnemyShot(e,tx,ty){
  const r=e.rng,n=r.burst||1,base=Math.atan2(ty-e.y,tx-e.x);
  const dmg=e.dmg*2.4*(e.boss?1.1:1)/(n>1?1.6:1);
  for(let i=0;i<n;i++){
    const a=base+(i-(n-1)/2)*.22;
    G.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*r.spd,vy:Math.sin(a)*r.spd,dmg,life:3.5,col:r.col||'#ff7a7a',r:e.boss?7:5});
  }
}
function updateEShots(dt){
  if(!G.eshots.length)return;
  const x0=cx(),y0=cy(),tl=G.dragon?[G.dragon,...G.sdrags]:G.sdrags;
  for(const sh of G.eshots){
    sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.life-=dt;
    if(sh.life<=0){sh.dead=true;continue}
    let hit=false;
    const dm=Math.hypot(sh.x-x0,sh.y-y0);
    const w=G.walls;
    if(w&&dm<=w.R+3&&dm>=w.R-8){
      const idx=Math.floor(((Math.atan2(sh.y-y0,sh.x-x0)+6.283)%6.283)/6.283*w.segs.length),sg=w.segs[idx];
      if(sg&&sg.hp>0){sg.hp-=sh.dmg;hit=true}
    }
    if(!hit)for(const u of tl){if(u.hp<=0||u.inv)continue;if((u.x-sh.x)**2+(u.y-sh.y)**2<=(u.r+sh.r)**2){u.hp-=sh.dmg*.8;hit=true;break}}
    if(!hit)for(const a of G.allies){if(a.fly)continue;if((a.x-sh.x)**2+(a.y-sh.y)**2<=(a.r+sh.r+3)**2){a.hp-=sh.dmg*.8;hit=true;break}}
    if(!hit&&dm<=20+sh.r){hurt(sh.dmg*S.def);hit=true}
    if(hit){sh.dead=true;G.fx.push({k:'p',x:sh.x,y:sh.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,t:.3,c:sh.col})}
  }
  G.eshots=G.eshots.filter(q=>!q.dead);
}
function drawEShots(){
  for(const sh of G.eshots){
    ctx.beginPath();ctx.arc(sh.x,sh.y,sh.r,0,6.3);ctx.fillStyle=sh.col;ctx.fill();ctx.beginPath();ctx.arc(sh.x,sh.y,sh.r*1.7,0,6.3);ctx.globalAlpha=.3;ctx.fill();ctx.globalAlpha=1;
  }
}

/* ============ ACTUALIZACIÓN ============ */
function update(dt){
  G.t+=dt;
  // regeneración
  G.hp=Math.min(S.maxHp,G.hp+S.regen*dt);
  // spawns
  const rate=spawnRate(G.t);
  G.spawnAcc+=rate*dt;
  while(G.spawnAcc>=1){G.spawnAcc--;if(G.enemies.length<(LOWQ?110:160))spawnEnemy(false)}
  if(G.t>=G.nextBoss){G.nextBoss+=90;spawnEnemy(true);txt(cx(),cy()-80,'¡Llega un jefe!','#ff5a5a',22)}
  if(G.basicCd-dt<=0)fireBasic();else G.basicCd-=dt;
  // habilidades
  for(const s of SK){
    const l=G.skills[s.id];if(!l||s.kind==='passive')continue;
    G.cd[s.id]-=dt;
    if(G.cd[s.id]<=0){
      SRC=s.n;
      if(castSkill(s,l))G.cd[s.id]=s.cd/(S.atk*(G.haste>0?1.5:1));else G.cd[s.id]=0;
    }
  }
  updateUlts(dt);
  updateOrbit(dt);
  updateTentacles(dt);
  updateDragon(dt);
  updateSkelDragons(dt);
  updateHero(dt);
  updateSpecials(dt);
  updateZones(dt);
  // enemigos
  const mx=cx(),my=cy();let tn=null;G._tl=G.dragon?[G.dragon,...G.sdrags]:G.sdrags;
  for(const e of G.enemies){
    if(e.dead)continue;
    for(const t in e.dots){
      const d=e.dots[t];d.t-=dt;
      if(d.t<=0){delete e.dots[t];continue}
      const x=d.dps*mult(e,t)*dt;G.dmgBy[d.src||'DoT']=(G.dmgBy[d.src||'DoT']||0)+Math.min(x,Math.max(0,e.hp));e.hp-=x;e.acc+=x;e.accType=t;
    }
    e.accT-=dt;
    if(e.accT<=0){if(e.acc>=1)txt(e.x,e.y-e.r,Math.round(e.acc),TYPES[e.accType].c,11);e.acc=0;e.accT=.7}
    if(e.hp<=0){kill(e);continue}
    let sp=e.sp;
    if(e.slow){e.slow.t-=dt;if(e.slow.t<=0)e.slow=null;else sp*=1-e.slow.a}
    e.flash=Math.max(0,e.flash-dt);
    if(e.stun>0)e.stun-=dt;if(e.root>0)e.root-=dt;if(e.rep>0)e.rep-=dt;
    const dx=mx-e.x,dy=my-e.y,dist=Math.hypot(dx,dy);
    let ally=null,ad=1e9;
    for(const a of G.allies){if(a.fly)continue;const dd=Math.hypot(a.x-e.x,a.y-e.y);if(dd<ad){ad=dd;ally=a}}
    if(e.stun>0){}
    else if(e.rep>0){if(dist>1){e.x-=dx/dist*sp*1.4*dt;e.y-=dy/dist*sp*1.4*dt}}
    else if(e.rng&&rangedAct(e,dist,dt,sp)){}
    else if(wallHit(e,dist,dt)){}
    else if((tn=taunter(e))){
      const ddx=tn.x-e.x,ddy=tn.y-e.y,dd=Math.hypot(ddx,ddy);
      if(dd>e.r+tn.r){if(!(e.root>0)){e.x+=ddx/dd*sp*dt;e.y+=ddy/dd*sp*dt}}
      else if(!tn.inv)tn.hp-=e.dmg*dt*.8;
    }
    else if(ally&&ad<e.r+16&&ad<dist)ally.hp-=e.dmg*dt;
    else if(dist>e.r+20){if(!(e.root>0)){e.x+=dx/dist*sp*dt;e.y+=dy/dist*sp*dt}}
    else hurt(e.dmg*S.def*dt*(e.vt>G.t?.85:1));
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  updateAllies(dt);
  updateEShots(dt);
  // proyectiles
  for(const p of G.projs){
    if(p.kind==='boom'){updateBoom(p,dt)}
    else if(p.kind==='orb'){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
      for(const e of G.enemies){
        if(e.dead||p.hit.has(e))continue;
        if((e.x-p.x)**2+(e.y-p.y)**2<(p.size+e.r)**2){p.hit.add(e);hitEnemy(p,e)}
      }
      if(p.life<=0)p.dead=true;
    }else{
      if(!p.tgt||p.tgt.dead){
        release(p);
        let nb=null,bd=1e12;
        for(const e of G.enemies){if(e.dead||mult(e,p.type)===0)continue;const dd=(e.x-p.x)**2+(e.y-p.y)**2;if(dd<bd){bd=dd;nb=e}}
        if(!nb){p.dead=true;continue}
        p.tgt=nb;
      }
      const dx=p.tgt.x-p.x,dy=p.tgt.y-p.y,dist=Math.hypot(dx,dy),step=p.spd*dt;p.ang=Math.atan2(dy,dx);
      if(dist<=step+p.tgt.r){hitEnemy(p,p.tgt);p.dead=true}
      else{p.x+=dx/dist*step;p.y+=dy/dist*step}
      p.life-=dt;if(p.life<=0)p.dead=true;
    }
  }
  G.projs=G.projs.filter(p=>{if(p.dead){release(p);return false}return true});
  // efectos
  for(const f of G.fx){f.t-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt}}
  G.fx=G.fx.filter(f=>f.t>0);
  for(const t of G.texts){t.t-=dt;t.y-=28*dt}
  G.texts=G.texts.filter(t=>t.t>0);
  // muerte
  if(G.hp<=0)gameOver();
}

function paintBattlefield(g,W,H,x0,y0){
  let sd=1234567;const rnd=()=>{sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const R=(a,b)=>a+rnd()*(b-a),area=W*H;
  // tierra seca, clara
  const base=g.createRadialGradient(x0,y0,30,x0,y0,Math.max(W,H)*.75);
  base.addColorStop(0,'#d8c99a');base.addColorStop(1,'#a99a68');
  g.fillStyle=base;g.fillRect(0,0,W,H);
  // manchas de terreno
  for(let i=0;i<area/9000;i++){const px=R(0,W),py=R(0,H),pr=R(40,120),pg=g.createRadialGradient(px,py,2,px,py,pr);const lt=rnd()<.5;pg.addColorStop(0,lt?'rgba(255,245,200,.16)':'rgba(120,95,50,.14)');pg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=pg;g.beginPath();g.arc(px,py,pr,0,6.3);g.fill()}
  // granulado
  for(let i=0;i<area/260;i++){g.fillStyle=rnd()<.5?'rgba(90,70,35,'+R(.05,.14)+')':'rgba(255,250,215,'+R(.06,.16)+')';g.fillRect(R(0,W),R(0,H),R(1,2.6),R(1,2.6))}
  // grietas
  g.strokeStyle='rgba(80,60,30,.28)';g.lineWidth=1;
  for(let i=0;i<area/45000;i++){let x=R(0,W),y=R(0,H);g.beginPath();g.moveTo(x,y);for(let k=0;k<R(4,9);k++){x+=R(-26,26);y+=R(-22,22);g.lineTo(x,y)}g.stroke()}
  // marcas de quemado
  for(let i=0;i<area/70000;i++){const x=R(0,W),y=R(0,H),rr=R(24,60),q=g.createRadialGradient(x,y,2,x,y,rr);q.addColorStop(0,'rgba(40,30,20,.32)');q.addColorStop(1,'rgba(40,30,20,0)');g.fillStyle=q;g.beginPath();g.arc(x,y,rr,0,6.3);g.fill()}
  // cráteres
  for(let i=0;i<Math.max(5,area/110000);i++){
    const x=R(30,W-30),y=R(30,H-30),rx=R(22,48),ry=rx*R(.5,.7);
    g.fillStyle='rgba(60,45,25,.34)';g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.3);g.fill();
    g.fillStyle='rgba(40,28,14,.25)';g.beginPath();g.ellipse(x+3,y+3,rx*.7,ry*.7,0,0,6.3);g.fill();
    g.strokeStyle='rgba(245,230,185,.55)';g.lineWidth=2.4;g.beginPath();g.ellipse(x,y,rx+2,ry+2,0,Math.PI*1.05,Math.PI*1.95);g.stroke();
  }
  // matas de hierba
  for(let i=0;i<area/5200;i++){
    const x=R(0,W),y=R(0,H);g.strokeStyle=rnd()<.5?'rgba(98,125,52,.65)':'rgba(120,145,62,.6)';g.lineWidth=1.3;
    for(let k=0;k<4;k++){g.beginPath();g.moveTo(x+k*2,y);g.lineTo(x+k*2+R(-3,3),y-R(5,10));g.stroke()}
  }
  // rocas
  for(let i=0;i<area/38000;i++){
    const x=R(0,W),y=R(0,H),rr=R(5,13);
    g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(x+2,y+rr*.6,rr*1.1,rr*.45,0,0,6.3);g.fill();
    g.fillStyle='#8a8478';g.beginPath();g.ellipse(x,y,rr,rr*.75,R(0,3),0,6.3);g.fill();
    g.fillStyle='rgba(255,255,255,.28)';g.beginPath();g.ellipse(x-rr*.25,y-rr*.25,rr*.45,rr*.28,0,0,6.3);g.fill();
  }
  // restos de batalla: huesos, calaveras y flechas clavadas
  g.textAlign='center';g.textBaseline='middle';
  for(let i=0;i<Math.max(5,area/90000);i++){g.globalAlpha=.55;g.font=Math.round(R(14,22))+'px "Segoe UI Emoji",serif';g.fillText(rnd()<.55?'🦴':'💀',R(20,W-20),R(20,H-20));g.globalAlpha=1}
  for(let i=0;i<area/70000;i++){
    g.save();g.translate(R(10,W-10),R(10,H-10));g.rotate(R(0,6.3));
    g.strokeStyle='#6b4a2a';g.lineWidth=1.6;g.beginPath();g.moveTo(0,0);g.lineTo(R(16,26),0);g.stroke();
    g.strokeStyle='#a0443a';g.beginPath();g.moveTo(0,0);g.lineTo(-4,-3);g.moveTo(0,0);g.lineTo(-4,3);g.stroke();
    g.restore();
  }
  // borde suave para enmarcar
  const v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.78);
  v.addColorStop(0,'rgba(60,45,20,0)');v.addColorStop(1,'rgba(60,45,20,.30)');
  g.fillStyle=v;g.fillRect(0,0,W,H);
}
let BG=null;
function drawBG(x0,y0){

/* sprites de enemigos precalculados: dibujar un emoji con sombra y aura en cada fotograma era lo que más tardaba */
const SPR=new Map();
function enemySprite(e){
  const rr=Math.max(4,Math.round(e.r)),key=e.n+'|'+rr;
  let sp=SPR.get(key);if(sp)return sp;
  if(SPR.size>400)SPR.clear();
  const sz=Math.ceil(rr*3.6),c=document.createElement('canvas');
  c.width=c.height=Math.ceil(sz*dpr);
  const g=c.getContext('2d');g.scale(dpr,dpr);
  const m=sz/2;
  g.fillStyle='#0006';g.beginPath();g.ellipse(m,m+rr*.9,rr*.85,rr*.3,0,0,6.3);g.fill();
  g.beginPath();g.arc(m,m,rr*1.18,0,6.3);g.fillStyle='rgba(22,18,40,.5)';g.fill();
  g.beginPath();g.arc(m,m,rr*1.18,0,6.3);g.fillStyle=e.col+(e.boss?'55':'30');g.fill();
  g.strokeStyle='rgba(15,12,30,.75)';g.lineWidth=(e.boss?2:1.2)+1.8;g.stroke();
  g.strokeStyle=e.col+(e.boss?'ee':'cc');g.lineWidth=e.boss?2:1.2;g.stroke();
  g.textAlign='center';g.textBaseline='middle';g.font=(rr*2)+'px "Segoe UI Emoji",serif';
  if(e.boss){g.shadowColor=e.col;g.shadowBlur=14}
  g.fillText(e.e,m,m);
  sp={c,sz,rr};SPR.set(key,sp);return sp;
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);

  ctx.beginPath();ctx.arc(x0,y0,S.range,0,Math.PI*2);ctx.strokeStyle='#3a2a5a55';ctx.setLineDash([6,8]);ctx.stroke();ctx.setLineDash([]);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const z of G.zones){
    ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,6.3);
    ctx.fillStyle=z.fill||(z.kind==='hole'?'#000000aa':'#82e04e33');ctx.fill();
    ctx.strokeStyle=z.edge||(z.kind==='hole'?'#a050d0':'#82e04e');ctx.stroke();
    if(z.kind==='hole'){ctx.beginPath();ctx.arc(z.x,z.y,z.r*.35*(1+Math.sin(G.t*8)*.1),0,6.3);ctx.fillStyle='#000';ctx.fill()}
    if(z.kind==='rain'){
      ctx.strokeStyle='#e0d2a8';ctx.lineWidth=1.5;
      for(let i=0;i<16;i++){const ph=(G.t*2.2+i*.37)%1,ax=z.x+Math.sin(i*12.9)*z.r*.88,ay=z.y-z.r+ph*z.r*2;ctx.beginPath();ctx.moveTo(ax-2,ay-14);ctx.lineTo(ax,ay);ctx.stroke()}
      ctx.lineWidth=1;
    }
  }

    ctx.beginPath();ctx.arc(d.mark.x,d.mark.y,d.mark.r*(1-d.t*.4),0,6.3);ctx.fillStyle='#ff7a3d22';ctx.fill();ctx.strokeStyle='#ff7a3d';ctx.stroke()}

    if(e.stun>0||e.root>0||e.rep>0){ctx.font='14px "Segoe UI Emoji",serif';ctx.fillText(e.stun>0?'📌':e.root>0?'🌿':'💨',e.x,e.y-e.r-14)}
    if(e.hp<e.max){const w=e.r*2;ctx.fillStyle='#000a';ctx.fillRect(e.x-w/2,e.y-e.r-8,w,3);ctx.fillStyle='#e04050';ctx.fillRect(e.x-w/2,e.y-e.r-8,w*Math.max(0,e.hp/e.max),3)}
  }

  drawOctopus(x0,y0);
  drawClassFx(x0,y0);

const fmtT=t=>{t=Math.floor(t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function drawTooltip(){
  if(mouse.x<0)return;
  let h=null;
  const wmx=(mouse.x-cx())/Z+cx(),wmy=(mouse.y-cy())/Z+cy();
  for(const e of G.enemies){if((e.x-wmx)**2+(e.y-wmy)**2<(e.r+6)**2){h=e;break}}
  if(!h)return;
  const lines=[h.n+'  ·  Armadura: '+h.armor,'Vida: '+Math.ceil(h.hp)+' / '+Math.ceil(h.max),h.rng?'🎯 Dispara a distancia ('+Math.round(h.rng.range)+')':''].filter(Boolean);
  const res=[];
  for(const t in TYPES){const m=mult(h,t);if(m!==1)res.push(TYPES[t].i+' '+TYPES[t].n+' x'+m)}
  const rows=lines.concat(res.length?res:['Sin resistencias ni debilidades']);
  const w=250,hh=rows.length*17+12;
  let x=Math.min(mouse.x+16,W-w-8),y=Math.min(mouse.y+16,H-hh-8);
  ctx.fillStyle='#0d0c1ae8';ctx.fillRect(x,y,w,hh);ctx.strokeStyle='#8f7cff';ctx.strokeRect(x+.5,y+.5,w-1,hh-1);
  ctx.textAlign='left';ctx.font='12px Segoe UI,sans-serif';
  rows.forEach((r,i)=>{
    const m=/x([\d.]+)$/.exec(r);
    ctx.fillStyle=i<2?'#fff':(m&&+m[1]>1?'#7be07b':m&&+m[1]===0?'#999':'#ff9a7a');
    ctx.fillText(r,x+8,y+14+i*17);
  });
  ctx.textAlign='center';
}

function itemCost(id){
  if(id==='egg')return G.dr.eggCost;
  if(id.startsWith('sp_')){const k=id.slice(3);return Math.round(SPBASE[k]*Math.pow(1.27,G.spLv[k]-1))}
  if(id==='potion')return 30+Math.floor(G.t/10);
  return ITEMS.find(i=>i.id===id).cost(G.items[id]);
}
function itemAvail(id){
  if(id==='egg')return !G.dragon&&!G.dr.egg;
  if(id.startsWith('sp_')){const sp=SPS.find(s=>'sp_'+s.id===id);return G.lvl>=sp.unlock&&G.spLv[sp.id]<SPMAX}
  if(id==='potion')return G.hp<S.maxHp;
  const it=ITEMS.find(i=>i.id===id);return G.items[id]<it.max;
}
function buy(id){
  if(G.over||!itemAvail(id))return;
  if(id==='egg'){buyEgg();refreshAll();return}
  const c=itemCost(id);if(G.gold<c)return;
  G.gold-=c;
  if(id==='potion')G.hp=Math.min(S.maxHp,G.hp+S.maxHp*.5);
  else if(id.startsWith('sp_'))G.spLv[id.slice(3)]++;
  else{G.items[id]++;if(id==='robe')G.hp+=25}
  recalc();refreshAll();
}
function refreshShop(){

  for(const id in shopEls){
    const b=shopEls[id],av=itemAvail(id),c=itemCost(id);
    const sp0=id.startsWith('sp_')&&SPS.find(s=>'sp_'+s.id===id);
    b.style.display=(sp0&&G.lvl<sp0.unlock&&sp0!==nextLocked)?'none':'';
    b.classList.toggle('off',!av||G.gold<c);

}

}

const TZP={'America/Argentina':'AR','America/Buenos_Aires':'AR','America/Mexico_City':'MX','America/Bogota':'CO','America/Santiago':'CL','America/Lima':'PE','America/Caracas':'VE','America/Sao_Paulo':'BR','America/Montevideo':'UY','America/Asuncion':'PY','America/La_Paz':'BO','America/Guayaquil':'EC','America/Panama':'PA','America/Costa_Rica':'CR','America/Havana':'CU','Europe/Madrid':'ES','Europe/London':'GB','Europe/Paris':'FR','Europe/Berlin':'DE','Europe/Rome':'IT','Europe/Lisbon':'PT','America/New_York':'US','America/Chicago':'US','America/Los_Angeles':'US','America/Denver':'US','America/Toronto':'CA','Asia/Tokyo':'JP','Asia/Seoul':'KR','Asia/Shanghai':'CN','Asia/Kolkata':'IN','Australia/':'AU'};
function detectFlag(){
  let cc=null;
  try{
    const langs=(typeof navigator!=='undefined'&&(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language]))||[];
    for(const l of langs){const m=/[-_]([A-Za-z]{2})$/.exec(l||'');if(m){cc=m[1].toUpperCase();break}}
    if(!cc){const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const k=Object.keys(TZP).find(p=>tz.startsWith(p));if(k)cc=TZP[k]}
  }catch(e){}
  return cc;
}
const flagEmoji=cc=>cc&&/^[A-Z]{2}$/.test(cc)?String.fromCodePoint(...[...cc].map(c=>127397+c.charCodeAt(0))):'🏳️';
let FLAG=detectFlag();
function loadRank(){try{const r=JSON.parse(localStorage.getItem('mago_rank')||'[]');return Array.isArray(r)?r:[]}catch(e){return []}}
function saveRun(){
  const r=loadRank(),run={n:G.nick||'Mago',f:FLAG||'',t:Math.round(G.t*10)/10,l:G.lvl,h:G.hero,d:Date.now()};
  r.push(run);r.sort((a,b)=>b.t-a.t);
  const top=r.slice(0,100);
  try{localStorage.setItem('mago_rank',JSON.stringify(top))}catch(e){}
  best=top.length?top[0].t:0;
  G.lastRun=run;
  return top.indexOf(run);
}
function rankHTML(limit,mine){
  const r=loadRank().slice(0,limit);
  if(!r.length)return '<p>Aún no hay partidas guardadas.</p>';
  return '<table class="rank"><tr><th>#</th><th>Jugador</th><th>Héroe</th><th>Tiempo</th><th>Nivel</th></tr>'+
    r.map((x,i)=>'<tr'+(mine&&x.d===mine.d?' class="me"':'')+'><td>'+(i+1)+'</td><td>'+flagEmoji(x.f)+' '+esc(x.f||'')+' '+esc(x.n)+'</td><td>'+(HEROES[x.h]?HEROES[x.h].icon+' '+HEROES[x.h].n:'🧙 Mago')+'</td><td>'+fmtT(x.t)+'</td><td>'+x.l+'</td></tr>').join('')+'</table>';
}
let selHero='mage',PREV=[];
function drawPreviews(now){
  for(const p of PREV){p.c.clearRect(0,0,130,150);drawHeroOn(p.c,65,104,p.k,now,Math.sin(now*1.2)*.6,2.3)}
}
function showStart(){
  G.modal='start';G.paused=true;
  const o=$('#overlay');o.style.display='flex';
  let nick='';try{nick=localStorage.getItem('mago_nick')||'';selHero=localStorage.getItem('mago_hero')||selHero}catch(e){}
  if(!HEROES[selHero])selHero='mage';
  o.innerHTML='<div class="card" style="max-width:860px;text-align:center"><h1>🧙 Mago Infinito</h1><p>Elige tu héroe y sobrevive el mayor tiempo posible.</p><div class="heroes" id="heroes"></div>'+
    '<div id="heroDesc" class="sub" style="min-height:34px;margin:8px 0"></div>'+
    '<div style="margin:6px 0"><input type="text" id="nick" maxlength="16" placeholder="Tu apodo" value="'+esc(nick)+'"> <span title="Detectada por tu navegador">'+flagEmoji(FLAG)+' '+esc(FLAG||'')+'</span></div>'+
    '<button class="btn" id="play">Jugar</button> <button class="btn alt" id="rk">🏆 Ranking</button></div>';
  PREV=[];const cards={};
  const box=$('#heroes');
  const pick=k=>{selHero=k;for(const q in cards)cards[q].className='hcard'+(q===k?' on':'');$('#heroDesc').textContent=HEROES[k].icon+' '+HEROES[k].n+' — '+HEROES[k].desc};
  Object.keys(HEROES).forEach(k=>{
    const d=document.createElement('div');d.className='hcard'+(k===selHero?' on':'');
    d.innerHTML='<canvas width="130" height="150"></canvas><b>'+HEROES[k].n+'</b>';
    d.onclick=()=>pick(k);
    box.appendChild(d);cards[k]=d;
    PREV.push({c:d.querySelector('canvas').getContext('2d'),k});
  });
  pick(selHero);
  const go=()=>{
    const n=($('#nick').value||'').trim().slice(0,16)||'Mago';
    try{localStorage.setItem('mago_nick',n);localStorage.setItem('mago_hero',selHero)}catch(e){}
    PREV=[];
    newGame(selHero);G.nick=n;
    G.modal=null;G.paused=false;$('#overlay').style.display='none';
  };
  $('#play').onclick=go;
  $('#rk').onclick=()=>{PREV=[];showRank('start')};
  const inp=$('#nick');if(inp.addEventListener)inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}
function showRank(from){
  if(G.modal==='rank')return;
  const prev=from||(G.over?'over':'game');
  G.rankFrom=prev;G.rankPaused=G.paused;
  if(prev==='game'){G.modal='rank';G.paused=true}else G.modal='rank';
  const o=$('#overlay');o.style.display='flex';
  o.innerHTML='<div class="card"><h1>🏆 Ranking (este equipo)</h1><p>Los 100 mejores tiempos guardados en este navegador.</p>'+rankHTML(100,G.lastRun)+'<div style="text-align:center"><button class="btn" id="rkc">Cerrar</button></div></div>';
  $('#rkc').onclick=closeRank;
}
function closeRank(){
  if(G.rankFrom==='start'){showStart();return}
  if(G.rankFrom==='over'){showOver();return}
  G.modal=null;G.paused=G.rankPaused;$('#overlay').style.display='none';
}
function dmgTable(){
  const a=Object.entries(G.dmgBy).sort((x,y)=>y[1]-x[1]),tot=a.reduce((q,x)=>q+x[1],0)||1;
  return '<div style="text-align:left;font-size:12px;margin:6px 0 10px"><b>Daño por fuente</b>'+a.slice(0,8).map(([n,v])=>'<div style="display:flex;gap:8px"><span style="flex:1">'+esc(n)+'</span><span>'+Math.round(v/tot*100)+'%</span></div>').join('')+'</div>';
}
function showOver(){
  G.modal='over';G.paused=true;
  const o=$('#overlay');o.style.display='flex';
  o.innerHTML='<div class="card" style="max-width:460px;text-align:center"><h1>💀 '+HEROES[G.hero].icon+' '+HEROES[G.hero].n+' ha caído</h1><p>'+flagEmoji(FLAG)+' <b>'+esc(G.nick||'Mago')+'</b> sobrevivió <b>'+fmtT(G.t)+'</b> · Nivel <b>'+G.lvl+'</b> · <b>'+G.kills+'</b> enemigos<br>Puesto en tu ranking: <b>'+(G.rankPos+1)+'</b> · Mejor tiempo: '+fmtT(best)+'</p>'+dmgTable()+
    '<div style="max-height:150px;overflow:auto;text-align:left">'+rankHTML(10,G.lastRun)+'</div><button class="btn" id="again">Jugar de nuevo (R)</button> <button class="btn alt" id="rk2">🏆 Ranking</button> <button class="btn alt" id="chg">Cambiar héroe</button></div>';
  $('#again').onclick=()=>{newGame();G.modal=null};
  $('#rk2').onclick=()=>showRank('over');
  $('#chg').onclick=()=>showStart();
}
function gameOver(){
  G.over=true;G.rankPos=saveRun();
  showOver();
}
function refreshBadges(){
  const a=$('#bdgSk'),b=$('#bdgSh');
  if(a){a.textContent=G.pending;a.style.display=G.pending>0?'flex':'none'}
  if(b){b.textContent=G.dr.pts;b.style.display=G.dr.pts>0?'flex':'none'}
}
function setupDrawers(){
  const map={left:'#left',shopc:'#shopc'};
  const btns=document.querySelectorAll('#tbar button');
  const unpause=()=>{if(G.drawerPause){G.paused=false;G.drawerPause=false}};
  const closeAll=()=>{for(const k in map)$(map[k]).classList.remove('open');btns.forEach(b=>b.classList.remove('on'));unpause()};
  for(const k in map){
    const el=$(map[k]);
    if(!el.insertBefore)continue;
    const h=document.createElement('div');h.className='dhead';
    h.innerHTML='<span>⏸ El juego se pausa mientras compras</span><button class="dclose">✕</button>';
    el.insertBefore(h,el.firstChild);
    h.querySelector('.dclose').onclick=closeAll;
  }
  btns.forEach(b=>b.onclick=()=>{
    if(G.modal)return;
    const k=b.getAttribute('data-d'),el=$(map[k]),was=el.classList.contains('open');
    closeAll();
    if(!was){el.classList.add('open');b.classList.add('on');if(!G.paused&&!G.over){G.paused=true;G.drawerPause=true}}
  });
  window.closeDrawers=closeAll;
}
function setZoom(z){
  Z=Math.max(.5,Math.min(1.8,z));
  try{localStorage.setItem('mago_zoom',String(Z))}catch(e){}
}
function buildRankBtn(){
  for(const [txt,tip,fn] of [['➖','Alejar (zoom out)',()=>setZoom(Z/1.15)],['➕','Acercar (zoom in)',()=>setZoom(Z*1.15)]]){
    const zb=document.createElement('button');zb.className='ctl';zb.textContent=txt;zb.title=tip;zb.onclick=fn;$('#bar').appendChild(zb);
  }
  const rb=document.createElement('button');rb.className='ctl';rb.textContent='🏆';rb.title='Ranking';rb.onclick=()=>{if(!G.modal)showRank('game')};
  $('#bar').appendChild(rb);
}

/* ============ ENTRADA Y BUCLE ============ */
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  if(G.modal==='over'&&k==='r'){newGame();G.modal=null;return}
  if(G.modal)return;
  if(/^[0-9]$/.test(k)){spendSkill(k==='0'?9:+k-1);return}
  if(k==='+'||k==='='){setZoom(Z*1.15);return}
  if(k==='-'||k==='_'){setZoom(Z/1.15);return}
  const sp=SPS.find(s=>s.key===k);
  if(sp){if(e.shiftKey)toggleAuto(sp.id);else useSpecial(sp.id);return}
  if(k==='p'||k===' ')G.paused=!G.paused;
  if(k==='f')cycleSpeed();
});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
cv.addEventListener('mouseleave',()=>{mouse.x=-1});
let pinch=null;
const tdist=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
cv.addEventListener('touchstart',e=>{
  if(window.closeDrawers)window.closeDrawers();
  if(e.touches.length===2)pinch={d:tdist(e),z:Z};
  else if(e.touches.length===1){const r=cv.getBoundingClientRect();mouse.x=e.touches[0].clientX-r.left;mouse.y=e.touches[0].clientY-r.top}
},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();setZoom(pinch.z*tdist(e)/pinch.d)}},{passive:false});
cv.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null;setTimeout(()=>{mouse.x=-1},1500)});
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(Z*(e.deltaY<0?1.1:1/1.1))},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!G.modal)G.paused=true});

let uiT=0;
function frame(now){
  const raw=(now-last)/1000;const dt=Math.min(.05,raw);last=now;
  if(raw>0&&raw<.5){avgDt=avgDt*.97+raw*.03;if(avgDt>.032)LOWQ=true;else if(avgDt<.021)LOWQ=false}
  if(!G.paused&&!G.modal&&!G.over){
    for(let i=0;i<G.speed;i++)update(dt);
  }
  uiT+=dt;if(uiT>.25){uiT=0;refreshAll()}
  refreshBar();
  if(G.modal==='start'&&PREV.length)drawPreviews(now/1000);
  draw();
  requestAnimationFrame(frame);
}
{const r0=loadRank();best=r0.length?r0[0].t:0}
resize();buildShop();buildSkillsMenu();buildPowers();buildDragonUI();buildBar();buildRankBtn();buildTabs();setupDrawers();
{let z=NaN;try{z=parseFloat(localStorage.getItem('mago_zoom'))}catch(e){}if(z)Z=Math.max(.5,Math.min(1.8,z));else if(typeof innerWidth!=='undefined'&&innerWidth<700)Z=.7}
newGame();showStart();
requestAnimationFrame(t=>{last=t;frame(t)});
</script>
